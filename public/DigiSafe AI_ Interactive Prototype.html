<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DigiSafe AI — Prototype</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #FAF9FC;
      --card: #fff;
      --fg: #211A2B;
      --mut: #716B7B;
      --bd: #E6E0EF;
      --pri: #6D3CC7;
      --prih: #582DA8;
      --prif: #fff;
      --deep: #24133F;
      --tint: #EEE7FA;
      --lav: #A78BDA;
      --ok: #237A57;
      --warn: #946200;
      --err: #B42335;
      --info: #245DA8;
      --r: 18px;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #17111F;
        --card: #211A2B;
        --fg: #F7F3FC;
        --mut: #BDB2CE;
        --bd: #3B3048;
        --pri: #A987E8;
        --prih: #C0A5F0;
        --prif: #17111F;
        --tint: #2E2342;
        --deep: #F7F3FC;
        --ok: #5CC49A;
        --warn: #E8B34A;
        --err: #F07A88;
        --info: #7FB0EE
      }
    }

    :root[data-theme="dark"] {
      --bg: #17111F;
      --card: #211A2B;
      --fg: #F7F3FC;
      --mut: #BDB2CE;
      --bd: #3B3048;
      --pri: #A987E8;
      --prih: #C0A5F0;
      --prif: #17111F;
      --tint: #2E2342;
      --deep: #F7F3FC;
      --ok: #5CC49A;
      --warn: #E8B34A;
      --err: #F07A88;
      --info: #7FB0EE
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 400 16px/1.55 Figtree, system-ui, sans-serif;
      min-height: 100vh
    }

    h1,
    h2,
    h3 {
      font-family: 'Bricolage Grotesque', Figtree, sans-serif;
      letter-spacing: -.02em;
      line-height: 1.1;
      margin: 0 0 .5em;
      color: var(--deep)
    }

    h1 {
      font-size: clamp(2.3rem, 6vw, 4rem);
      font-weight: 700
    }

    h2 {
      font-size: clamp(1.6rem, 3.4vw, 2.2rem)
    }

    h3 {
      font-size: 1.15rem
    }

    p {
      margin: 0 0 1em;
      max-width: 62ch
    }

    a {
      color: var(--pri)
    }

    button {
      font: inherit;
      cursor: pointer
    }

    :focus-visible {
      outline: 3px solid var(--pri);
      outline-offset: 2px;
      border-radius: 8px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--bd)
    }

    .bar {
      max-width: 1120px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font: 700 1.15rem 'Bricolage Grotesque', sans-serif;
      color: var(--deep);
      text-decoration: none;
      margin-right: auto
    }

    .mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--pri), var(--lav));
      display: grid;
      place-items: center
    }

    nav {
      display: flex;
      gap: 4px
    }

    nav a {
      padding: 8px 13px;
      border-radius: 99px;
      text-decoration: none;
      color: var(--fg);
      font-weight: 500;
      font-size: .95rem
    }

    nav a:hover {
      background: var(--tint)
    }

    nav a.on {
      background: var(--tint);
      color: var(--pri);
      font-weight: 600
    }

    .ib {
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--fg);
      border-radius: 99px;
      padding: 8px 13px;
      font-weight: 500;
      font-size: .9rem
    }

    .exit {
      background: var(--deep);
      color: var(--bg);
      border-color: transparent
    }

    @media(max-width:760px) {
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        border-top: 1px solid var(--bd);
        justify-content: space-around;
        padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
        z-index: 6
      }

      nav a {
        font-size: .8rem;
        padding: 8px 9px
      }

      body {
        padding-bottom: 70px
      }
    }

    main {
      max-width: 1120px;
      margin: auto;
      padding: 28px 20px 60px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      background: var(--pri);
      color: var(--prif);
      padding: 13px 22px;
      border-radius: 99px;
      font-weight: 600;
      transition: transform .15s, background .15s
    }

    .btn:hover {
      background: var(--prih);
      transform: translateY(-1px)
    }

    .btn.ghost {
      background: var(--tint);
      color: var(--pri)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      padding: 22px
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 30px;
      align-items: center;
      min-height: 62vh
    }

    @media(max-width:860px) {
      .hero {
        grid-template-columns: 1fr
      }
    }

    .orbwrap {
      position: relative;
      aspect-ratio: 1;
      max-width: 420px;
      width: 100%;
      margin: auto;
      display: grid;
      place-items: center;
      cursor: pointer
    }

    .orb {
      width: 68%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff8, transparent 38%), radial-gradient(circle at 50% 50%, var(--lav), var(--pri) 60%, var(--deep));
      box-shadow: 0 30px 80px color-mix(in srgb, var(--pri) 45%, transparent);
      animation: breathe 6s ease-in-out infinite;
      transform: translate(var(--x, 0), var(--y, 0))
    }

    .ring {
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      border: 1.5px solid var(--bd);
      animation: breathe 6s ease-in-out infinite reverse
    }

    .orbtxt {
      position: absolute;
      bottom: 2%;
      background: var(--card);
      border: 1px solid var(--bd);
      padding: 8px 16px;
      border-radius: 99px;
      font-weight: 600;
      font-size: .9rem;
      box-shadow: 0 6px 20px #0001
    }

    @keyframes breathe {
      50% {
        transform: translate(var(--x, 0), var(--y, 0)) scale(1.06)
      }
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 10px
    }

    @media(max-width:860px) {
      .tiles {
        grid-template-columns: 1fr 1fr
      }
    }

    .tile {
      text-align: left;
      border: 1px solid var(--bd);
      background: var(--card);
      border-radius: var(--r);
      padding: 20px;
      color: var(--fg);
      text-decoration: none;
      display: block;
      transition: .2s
    }

    .tile:hover {
      border-color: var(--pri);
      transform: translateY(-3px);
      box-shadow: 0 14px 30px color-mix(in srgb, var(--pri) 15%, transparent)
    }

    .tile b {
      display: block;
      font: 700 1.05rem 'Bricolage Grotesque', sans-serif;
      color: var(--deep);
      margin: 10px 0 2px
    }

    .tile span {
      color: var(--mut);
      font-size: .9rem
    }

    .ico {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--tint);
      color: var(--pri);
      display: grid;
      place-items: center
    }

    .note {
      display: flex;
      gap: 10px;
      background: var(--tint);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: .92rem;
      color: var(--fg)
    }

    .note.info {
      border-left: 4px solid var(--info)
    }

    .note.warn {
      border-left: 4px solid var(--warn)
    }

    .prog {
      height: 6px;
      background: var(--tint);
      border-radius: 9px;
      overflow: hidden;
      margin: 6px 0 22px
    }

    .prog i {
      display: block;
      height: 100%;
      background: var(--pri);
      transition: width .4s
    }

    .opts {
      display: grid;
      gap: 10px;
      margin: 14px 0
    }

    .opt {
      text-align: left;
      border: 1.5px solid var(--bd);
      background: var(--card);
      color: var(--fg);
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 500;
      transition: .15s
    }

    .opt:hover {
      border-color: var(--lav)
    }

    .opt.sel {
      border-color: var(--pri);
      background: var(--tint);
      color: var(--deep);
      box-shadow: inset 0 0 0 1px var(--pri)
    }

    textarea,
    input[type=text],
    select {
      width: 100%;
      font: inherit;
      color: var(--fg);
      background: var(--card);
      border: 1.5px solid var(--bd);
      border-radius: 14px;
      padding: 13px 15px
    }

    textarea {
      min-height: 130px;
      resize: vertical
    }

    label {
      font-weight: 600;
      font-size: .92rem;
      display: block;
      margin: 14px 0 6px
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 18px
    }

    .narrow {
      max-width: 640px;
      margin: auto
    }

    .code {
      font: 700 2rem 'Bricolage Grotesque', sans-serif;
      letter-spacing: .12em;
      color: var(--pri);
      background: var(--tint);
      border-radius: 14px;
      padding: 14px 20px;
      display: inline-block
    }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: min(56vh, 520px);
      overflow: auto;
      padding: 6px 2px
    }

    .b {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 20px;
      animation: pop .25s
    }

    .b.ai {
      background: var(--card);
      border: 1px solid var(--bd);
      border-bottom-left-radius: 6px
    }

    .b.me {
      align-self: flex-end;
      background: var(--pri);
      color: var(--prif);
      border-bottom-right-radius: 6px
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    .dots span {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 2px;
      border-radius: 50%;
      background: var(--mut);
      animation: dot 1s infinite
    }

    .dots span:nth-child(2) {
      animation-delay: .15s
    }

    .dots span:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes dot {
      50% {
        transform: translateY(-4px);
        opacity: .4
      }
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 4px 0
    }

    .chip {
      border: 1.5px solid var(--pri);
      color: var(--pri);
      background: transparent;
      border-radius: 99px;
      padding: 8px 15px;
      font-weight: 500
    }

    .chip:hover {
      background: var(--tint)
    }

    .send {
      display: flex;
      gap: 8px;
      margin-top: 10px
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    @media(max-width:700px) {
      .grid2 {
        grid-template-columns: 1fr
      }
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 11px;
      border-radius: 99px;
      font-size: .8rem;
      font-weight: 600;
      background: var(--tint);
      color: var(--deep)
    }

    .tag.u-high {
      background: color-mix(in srgb, var(--err) 14%, var(--card));
      color: var(--err)
    }

    .tag.u-med {
      background: color-mix(in srgb, var(--warn) 16%, var(--card));
      color: var(--warn)
    }

    .tag.u-low {
      background: color-mix(in srgb, var(--ok) 14%, var(--card));
      color: var(--ok)
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .92rem
    }

    th {
      text-align: left;
      color: var(--mut);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid var(--bd)
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--bd)
    }

    tr.case {
      cursor: pointer
    }

    tr.case:hover td {
      background: var(--tint)
    }

    .scroll {
      overflow-x: auto
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px
    }

    @media(max-width:700px) {
      .stats {
        grid-template-columns: 1fr 1fr
      }
    }

    .stat b {
      display: block;
      font: 700 1.9rem 'Bricolage Grotesque', sans-serif;
      color: var(--deep)
    }

    .stat span {
      color: var(--mut);
      font-size: .88rem
    }

    .view {
      animation: pop .3s
    }

    .neutral {
      position: fixed;
      inset: 0;
      background: #fff;
      color: #222;
      z-index: 99;
      padding: 40px;
      font-family: Arial, sans-serif;
      cursor: pointer
    }

    .proto {
      font-size: .8rem;
      color: var(--mut);
      text-align: center;
      padding: 18px
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <a class="logo" href="#home"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" />
            <path d="M9 12l2 2 4-4" />
          </svg></span>DigiSafe AI</a>
      <nav id="nav"><a href="#report" data-v="report">Report</a><a href="#companion" data-v="companion">Talk to AI</a><a
          href="#help" data-v="help">Get help now</a><a href="#learn" data-v="learn">Learn</a></nav>
      <button class="ib" id="theme" aria-label="Toggle dark mode">◐</button>
      <button class="ib exit" id="exit" title="Leaves to a neutral page. It cannot erase browser history.">Quick
        exit</button>
    </div>
  </header>
  <main id="app"></main>
  <div class="proto">Design prototype · synthetic data only · not a live reporting service · <a href="#staff">Staff
      preview</a></div>
  <script>
    const $ = s => document.querySelector(s), app = $('#app');
    const I = { r: '<path d="M4 4h16v13H8l-4 4z"/>', c: '<path d="M12 3a8 8 0 100 16 8 8 0 000-16z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>', h: '<path d="M12 21s-7-4.5-7-11a4 4 0 017-2.5A4 4 0 0119 10c0 6.500-7 11-7 11z"/>', l: '<path d="M4 5h7a3 3 0 013 3v12a2 2 0 00-2-2H4zM20 5h-6"/>' };
    const ic = k => `<div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg></div>`;
    const S = { rep: { step: 0, who: '', cat: '', desc: '', ctx: '', danger: '', contact: '' }, ref: '' };
    const CATS = ['Bullying, cyberbullying or intimidation', 'Threats, blackmail or pressure to do something', 'Unwanted sexual messages or content', 'Threats to share, or sharing of, private images', 'An adult contacting me in a way that feels wrong', 'Physical or sexual harm', 'Stalking, discrimination or feeling unsafe', 'Something else / I’m not sure'];
    const V = {};
    V.home = () => `<section class="hero"><div><h1>Speak up. Find support. Stay safer.</h1><p style="font-size:1.12rem;color:var(--mut)">A calm, private place for students to report a concern, talk things through, and find real people who can help. You don’t need an account.</p><div class="row"><a class="btn" href="#report">Report something</a><a class="btn ghost" href="#companion">Talk to DigiSafe AI</a></div></div>
<div class="orbwrap" id="orb" onclick="location.hash='companion'" role="link" tabindex="0" aria-label="Open the AI companion"><div class="ring"></div><div class="orb"></div><span class="orbtxt">Say hi, no pressure</span></div></section>
<div class="tiles"><a class="tile" href="#report">${ic('r')}<b>Report something</b><span>Short guided steps. Anonymous if you prefer.</span></a><a class="tile" href="#companion">${ic('c')}<b>Talk to the AI companion</b><span>Listens, explains your options.</span></a><a class="tile" href="#help">${ic('h')}<b>Get help now</b><span>Verified services and urgent guidance.</span></a><a class="tile" href="#learn">${ic('l')}<b>Learn about online safety</b><span>Short, practical, judgment-free.</span></a></div>
<div class="note info" style="margin-top:22px"><span>ⓘ</span><span>DigiSafe AI is an initiative of AYVDI. The AI is a support tool, not an emergency service or a replacement for trained people. Nothing here is your fault.</span></div>`;
    function pbar(n, t) { return `<div class="prog" role="progressbar" aria-valuenow="${n}" aria-valuemax="${t}"><i style="width:${n / t * 100}%"></i></div>` }
    function opts(list, key) { return `<div class="opts">${list.map(o => `<button class="opt ${S.rep[key] === o ? 'sel' : ''}" onclick="setR('${key}',this.dataset.v)" data-v="${o}">${o}</button>`).join('')}</div>` }
    window.setR = (k, v) => { S.rep[k] = v; render() }; window.go = d => { S.rep.step += d; render(); scrollTo(0, 0) };
    V.report = () => {
      const r = S.rep, s = r.step, T = 7; let b = '', ok = true;
      if (s == 0) { b = `<h2>Before you start</h2><p>You choose what to share. Here’s what to expect:</p><div class="note info"><span>ⓘ</span><span>Reporting without contact details is allowed. It may mean we can’t ask questions or send updates. Some technical data may still exist on servers, so we can’t promise complete anonymity.</span></div><div class="note warn" style="margin-top:10px"><span>⚠</span><span>Please don’t upload or send nude or private images. You can describe what happened in words instead.</span></div>` }
      if (s == 1) { b = `<h2>Who is this about?</h2>${opts(['It happened to me', 'I’m worried about someone else'], 'who')}`; ok = !!r.who }
      if (s == 2) { b = `<h2>What best describes it?</h2><p>Pick the closest one. “Not sure” is a fine answer.</p>${opts(CATS, 'cat')}`; ok = !!r.cat }
      if (s == 3) { b = `<h2>Tell us in your own words</h2><p>Share only what feels okay. Graphic details aren’t needed.</p><textarea oninput="S.rep.desc=this.value" placeholder="What happened?">${r.desc}</textarea><label>When, or where online? (optional)</label><input type="text" oninput="S.rep.ctx=this.value" value="${r.ctx}" placeholder="e.g. last week, on a chat app">`; ok = r.desc.trim().length > 3 }
      if (s == 4) { b = `<h2>Are you in danger right now?</h2>${opts(['Yes, I need help now', 'No, I’m safe for now', 'I’m not sure'], 'danger')}${r.danger.startsWith('Yes') ? `<div class="note warn"><span>⚠</span><span>Please open <a href="#help">Get help now</a> first. You can come back to this report anytime.</span></div>` : ''}`; ok = !!r.danger }
      if (s == 5) { b = `<h2>Safe way to reach you? (optional)</h2><p>Only add this if you want a follow-up. It’s stored separately and used only by authorised safeguarding staff.</p><input type="text" oninput="S.rep.contact=this.value" value="${r.contact}" placeholder="A number or email that is safe for you">` }
      if (s == 6) { b = `<h2>Review before sending</h2><div class="card">${[['About', r.who], ['Type', r.cat], ['Your words', r.desc], ['When or where', r.ctx || 'Not added'], ['Danger now', r.danger], ['Contact', r.contact ? 'Added, kept separate' : 'None. Anonymous report']].map(x => `<p style="margin:0 0 12px"><b style="font-size:.85rem;color:var(--mut);display:block">${x[0]}</b>${x[1].replace(/</g, '&lt;')}</p>`).join('')}</div>` }
      if (s == 7) {
        const a = new Uint32Array(2); crypto.getRandomValues(a); S.ref = 'DS-' + a[0].toString(36).slice(0, 4).toUpperCase() + '-' + a[1].toString(36).slice(0, 4).toUpperCase();
        return `<div class="narrow view card" style="text-align:center"><div style="font-size:2.4rem;color:var(--ok)">✓</div><h2>Report saved</h2><p style="margin-inline:auto">Keep this code. It’s the only way to refer to your report.</p><div class="code">${S.ref}</div><p style="margin:18px auto 0">What happens next: in a live service, an authorised safeguarding officer would review reports during published hours. We’ll never say a person has seen it until that’s confirmed.</p><div class="row" style="justify-content:center"><a class="btn" href="#help">See who can help</a><button class="btn ghost" onclick="S.rep={step:0,who:'',cat:'',desc:'',ctx:'',danger:'',contact:''};render()">Done</button></div></div>`
      }
      return `<div class="narrow view">${pbar(s + 1, T)}<div class="card">${b}<div class="row">${s > 0 ? `<button class="btn ghost" onclick="go(-1)">Back</button>` : ''}<button class="btn" ${ok ? '' : 'disabled'} onclick="go(1)">${s == 0 ? 'I understand, start' : s == 6 ? 'Send report' : s == 5 && !r.contact ? 'Skip' : 'Continue'}</button></div></div></div>`
    };
    /* companion */
    let chat = [], busy = 0;
    const FLOW = {
      start: { t: ['Hi, I’m the DigiSafe AI companion. I’m an AI, not a person, and I can’t replace real help. Whatever you share, it’s not your fault.', 'What’s on your mind today?'], c: { 'Something online': 'online', 'Someone is hurting or scaring me': 'danger', 'I’m not sure': 'unsure', 'I just want to talk': 'unsure' } },
      online: { t: ['Thanks for telling me. That sounds stressful, and you did the right thing by speaking up.', 'Are you safe right now?'], c: { 'Yes, I’m safe': 'options', 'No, not really': 'danger' } },
      unsure: { t: ['That’s okay. We can go slowly. You don’t have to explain it perfectly.', 'Are you safe right now?'], c: { 'Yes, I’m safe': 'options', 'No, not really': 'danger' } },
      danger: { t: ['I’m really glad you told me. Your safety comes first.', 'If someone is hurting you or you’re in danger, please contact emergency services or a trusted adult who is safe for you. I can show verified contacts.'], c: { 'Show help contacts': 'GO:help', 'Make a report instead': 'GO:report' } },
      options: { t: ['Thank you. Here are some options. You choose what feels right.'], c: { 'Make a report': 'GO:report', 'Learn what this is': 'GO:learn', 'Get help from a person': 'GO:help' } }
    };
    function say(k) { const f = FLOW[k]; busy = 1; let i = 0; const n = () => { if (i >= f.t.length) { chat.push({ chips: f.c }); busy = 0; return render(1) } chat.push({ typing: 1 }); render(1); setTimeout(() => { chat.pop(); chat.push({ ai: f.t[i++] }); render(1); setTimeout(n, 500) }, 800) }; n() }
    window.pick = (l, t) => { if (busy) return; chat = chat.filter(m => !m.chips); chat.push({ me: l }); render(1); if (t.startsWith('GO:')) return setTimeout(() => location.hash = t.slice(3), 500); say(t) };
    window.sendTxt = () => { const i = $('#ct'); if (!i || !i.value.trim() || busy) return; const v = i.value; chat = chat.filter(m => !m.chips); chat.push({ me: v }); say(/hurt|kill|die|hit|beat|rape|touch|threat/i.test(v) ? 'danger' : 'unsure') };
    V.companion = () => {
      if (!chat.length) { chat = []; setTimeout(() => say('start'), 200) }
      return `<div class="narrow view"><h2>Talk to DigiSafe AI</h2><div class="note info" style="margin-bottom:12px"><span>ⓘ</span><span>AI support, not a human or emergency service. Reporting and help always work without it.</span></div><div class="card"><div class="chat" id="ch">${chat.map(m => m.typing ? '<div class="b ai dots"><span></span><span></span><span></span></div>' : m.ai ? `<div class="b ai">${m.ai}</div>` : m.me ? `<div class="b me">${m.me.replace(/</g, '&lt;')}</div>` : `<div class="chips">${Object.entries(m.chips).map(([l, t]) => `<button class="chip" onclick="pick('${l}','${t}')">${l}</button>`).join('')}</div>`).join('')}</div><div class="send"><input type="text" id="ct" placeholder="Type here, or pick an option" onkeydown="event.key=='Enter'&&sendTxt()"><button class="btn" onclick="sendTxt()">Send</button></div></div></div>`
    };
    const SVC = [['Cece Yara Child Advocacy Centre', 'Child helpline and support', 'Example for AYVDI to assess'], ['NAPTIP', 'Trafficking and exploitation concerns', 'Example for AYVDI to assess'], ['State child protection and social welfare', 'Local services by state', 'To be added per location'], ['Emergency services', 'Immediate danger or urgent medical need', 'To be added and tested']];
    V.help = () => `<div class="narrow view"><h2>Get help now</h2><div class="note warn" style="margin-bottom:14px"><span>⚠</span><span>If you or someone else is in immediate danger, contact local emergency services or a safe adult now.</span></div>${SVC.map(s => `<div class="card" style="margin-bottom:12px"><h3>${s[0]}</h3><p style="margin:0 0 8px;color:var(--mut)">${s[1]}</p><span class="tag">Contact: pending verification</span> <span class="tag">${s[2]}</span></div>`).join('')}<p style="color:var(--mut);font-size:.9rem">Each entry needs a verified number, hours, coverage and verification date from AYVDI before launch. Listing here does not imply a partnership.</p></div>`;
    const LRN = [['What’s a boundary?', 'Boundaries are limits you set for how people treat you. Someone pressuring you to share things you’re not comfortable with is crossing one.', ['Say no, then tell a safe person', 'Keep it secret to avoid trouble'], 0], ['Someone threatens to share a private image', 'This is blackmail. It’s never your fault, and paying or sending more usually doesn’t stop it.', ['Send more so they delete it', 'Stop replying, keep the messages, and ask for help'], 1], ['A friend tells you they’re being hurt', 'Listening matters most. You don’t have to fix it alone.', ['Stay calm, believe them, and help them find a safe adult', 'Confront the person yourself'], 0]];
    window.ans = (i, j) => { LRN[i].sel = j; render() };
    V.learn = () => `<div class="narrow view"><h2>Learn about online safety</h2><p style="color:var(--mut)">Quick scenarios. Tap an answer to see what to do.</p>${LRN.map((l, i) => `<div class="card" style="margin-bottom:14px"><h3>${l[0]}</h3><p>${l[1]}</p><div class="opts">${l[2].map((o, j) => `<button class="opt ${l.sel === j ? 'sel' : ''}" onclick="ans(${i},${j})">${o}</button>`).join('')}</div>${l.sel !== undefined ? `<div class="note ${l.sel === l[3] ? 'info' : 'warn'}"><span>${l.sel === l[3] ? '✓' : '!'}</span><span>${l.sel === l[3] ? 'Yes. That’s the safer choice.' : 'That might feel easier, but the other option is safer.'}</span></div>` : ''}</div>`).join('')}</div>`;
    const CASES = [['DS-7K2M', ' Threats about images', 'High', 'New', 'Unassigned', '12 min'], ['DS-4QX9', 'Cyberbullying', 'Medium', 'Under review', 'Amaka O.', '3 h'], ['DS-9LPA', 'Unwanted messages', 'Medium', 'Awaiting triage', 'Unassigned', '5 h'], ['DS-2WE6', 'Something else', 'Low', 'Follow-up required', 'Tunde B.', '1 d'], ['DS-8RJ1', 'Stalking or feeling unsafe', 'High', 'Referred', 'Amaka O.', '2 d']];
    let fl = 'All', sel = null;
    window.setF = f => { fl = f; sel = null; render() }; window.openC = i => { sel = i; render() };
    V.staff = () => {
      const rows = CASES.map((c, i) => [c, i]).filter(x => fl == 'All' || x[0][3] == fl);
      return `<div class="view"><h2>Staff dashboard</h2><div class="note info" style="margin-bottom:14px"><span>ⓘ</span><span>Preview with fictional cases. Real access needs server-side login and roles. Urgency is set by a person, never by AI alone.</span></div><div class="stats">${[['5', 'Open cases'], ['2', 'Urgent, human reviewed'], ['1', 'Unassigned and new'], ['42 min', 'Median first review']].map(s => `<div class="card stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
<div class="chips" style="margin-bottom:12px">${['All', 'New', 'Awaiting triage', 'Under review', 'Follow-up required', 'Referred'].map(f => `<button class="chip" style="${fl == f ? 'background:var(--pri);color:var(--prif)' : ''}" onclick="setF('${f}')">${f}</button>`).join('')}</div>
<div class="grid2" style="grid-template-columns:${sel !== null ? '1.3fr 1fr' : '1fr'}"><div class="card scroll"><table><tr><th>Ref</th><th>Category</th><th>Urgency</th><th>Status</th><th>Officer</th></tr>${rows.map(([c, i]) => `<tr class="case" tabindex="0" onclick="openC(${i})"><td><b>${c[0]}</b></td><td>${c[1]}</td><td><span class="tag u-${c[2] == 'High' ? 'high' : c[2] == 'Medium' ? 'med' : 'low'}">${c[2] == 'High' ? '▲ ' : ''}${c[2]}</span></td><td>${c[3]}</td><td>${c[4]}</td></tr>`).join('') || '<tr><td colspan=5>No cases in this status.</td></tr>'}</table></div>
${sel !== null ? `<div class="card"><h3>${CASES[sel][0]}</h3><p style="color:var(--mut)">${CASES[sel][1]}. Received ${CASES[sel][5]} ago.</p><label>Status</label><select>${['New', 'Awaiting triage', 'Under review', 'Follow-up required', 'Referred', 'Closed'].map(s => `<option ${s == CASES[sel][3] ? 'selected' : ''}>${s}</option>`).join('')}</select><label>Urgency (human reviewed)</label><select>${['High', 'Medium', 'Low'].map(s => `<option ${s == CASES[sel][2] ? 'selected' : ''}>${s}</option>`).join('')}</select><label>Rationale for change</label><textarea style="min-height:80px" placeholder="Required when status changes"></textarea><div class="row"><button class="btn">Save and log action</button></div><p style="font-size:.82rem;color:var(--mut);margin-top:12px">Every view and change is written to the audit trail.</p></div>` : ''}</div></div>`
    };
    function render(keep) {
      const v = (location.hash.slice(1) || 'home'), k = V[v] ? v : 'home'; const y = $('#ch')?.scrollTop; app.innerHTML = V[k](); document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.v == k));
      const ch = $('#ch'); if (ch) ch.scrollTop = ch.scrollHeight;
      const o = $('#orb'); if (o) o.onpointermove = e => { const b = o.getBoundingClientRect(); o.firstElementChild.nextElementSibling.style.setProperty('--x', ((e.clientX - b.left) / b.width - .5) * 30 + 'px'); o.firstElementChild.nextElementSibling.style.setProperty('--y', ((e.clientY - b.top) / b.height - .5) * 30 + 'px') };
      if (!keep) if (k == 'companion' && !chat.length) 0
    }
    addEventListener('hashchange', () => { render(); scrollTo(0, 0) });
    $('#theme').onclick = () => { const d = document.documentElement, cur = d.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); d.dataset.theme = cur == 'dark' ? 'light' : 'dark' };
    $('#exit').onclick = () => { const n = document.createElement('div'); n.className = 'neutral'; n.innerHTML = '<h2 style="color:#222">Weather</h2><p>Lagos: 31° Partly cloudy</p><p style="color:#999;font-size:13px">(Prototype: tap anywhere to return. The live site opens a neutral page and explains it can’t erase history.)</p>'; n.onclick = () => n.remove(); document.body.append(n) };
    render();
  </script>
